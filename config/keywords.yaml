# 강사 구인공고 판별·분류 규칙
# 제목 기준으로 판단하며, 비교할 때 공백은 무시한다 ('회원 모집' == '회원모집').

# 하나라도 포함되면 강사 공고 후보
# (sources.yaml 에서 keyword_filter: false 인 강사 전용 게시판은 이 검사를 건너뛴다)
include:
  - 강사
  - 인력풀
  - 지도자
  - 지도사
  - 코치
  - 트레이너
  - 강습
  - 방과후
  - 늘봄
  - 튜터
  - 교관

# 포함 키워드가 들어 있지만 다른 뜻인 낱말 (포함 검사 전에 제목에서 지운다)
# '청년마음건강사업 안내' 의 '강사' ('건강사업 운동강사 모집'은 뒤의 '강사'로 남는다)
include_ignore:
  - 건강사업
  - 건강사랑
  - 건강사회

# 포함되면 제외 (강사를 뽑는 공고가 아님)
exclude:
  - 수강생
  - 강습생
  - 회원 모집
  - 교육생
  - 포상
  - 공모전
  - 자원봉사자    # '방과후과정 지원 자원봉사자 모집' ('청소년자원봉사 교육강사 모집'은 남김)
  - 실무사        # 늘봄실무사·조리실무사 (강사가 아닌 교육공무직)
  - 실무원
  - 나는 강사다   # 평생학습주간 주민강사 경연 참가자 모집
  - 나도 강사다
  - 경연대회
  - 참가자 모집   # '멘토링 참가자 모집' 등 참여 청소년·주민을 모으는 글
  - 참여자 모집
  - 참가 신청
  - 양성과정 모집  # '파크골프 2급지도자(강사) 양성과정 모집안내' 는 수강생 모집 ('요양보호사 양성과정 강사 모집'은 남김)
  - 강사 양성     # '영유아 영어강사 양성 초급과정 모집' (강사가 될 사람을 가르치는 과정)
  - 강사 육성     # '늘봄&돌봄 부스터 강사육성 과정 수료자 공고'
  - 강사 초청     # '부모교육 「최민준 강사 초청 특강」 안내' (주민에게 알리는 강연)
  - 초청 특강
  - 강사와 함께   # "'기적의 놀이터 편해문 강사와 함께하는 부모 교육' 안내" (수영구육아종합지원센터)

# 모집이 끝난 뒤의 결과 공고, 또는 제목에 마감 표시가 붙은 공고
result_notice:
  - "[마감]"
  - (마감)
  - (완료)      # '(완료)장수대학 노래교실 강사 구인 공고' (영진종합사회복지관)
  - "[완료]"
  - 마감되었습니다
  - 조기마감
  - 채용 완료     # '시간강사 채용 공고 완료' (동래구국민체육센터)
  - 모집 완료
  - 공고 완료
  - 합격자
  - 합격 공고   # '생활체육지도자 대체근무자 서류 합격 공고' (사하구체육회)
  - 최종합격
  - 결과
  - 면접대상
  - 서류전형
  - 최종적격
  - 서류적격
  - 적격자
  - 적격대상  # '적격심사'(입찰 방식)는 결과가 아니라서 넣지 않음
  - 대상자 발표
  - 대상자 공지   # '「양성평등 교육 강사 역량강화 사업」 역량강화 교육 대상자 공지' (부산여성가족과평생교육진흥원)
  - 최종수탁자
  - 최종선발
  - 위촉 예정자
  - 위촉예정
  - 선정
  - 취소

# true 면 결과공고도 "결과공고" 상태로 엑셀에 남긴다
keep_result_notices: false

# 신규 시트에 넣을 최대 게시 경과일 (첫 실행 때 오래된 글이 쏟아지는 것 방지)
new_max_age_days: 45
# 마감일을 모르는 공고를 진행중으로 볼 기간 (게시일 기준)
active_max_age_days: 30
# 마감임박 기준 (D-n 이내)
closing_soon_days: 3

# 분야 분류 (위에서부터 먼저 매칭되는 분야로 분류, 없으면 "기타")
# 제목과 기관명에서 찾는다. '!' 로 시작하는 단어가 있으면 그 분야는 건너뛴다
# (예: 청소년방과후아카데미는 학교 방과후가 아님, 공단 수영장 시간강사는 학교 시간강사가 아님)
categories:
  방과후·늘봄: [방과후, 늘봄, 돌봄, "!방과후아카데미"]
  학교 시간강사: [시간강사, 기간제, 계약제, 교원, 교과, 소인수, 공동교육과정, "!공단", "!수영장", "!체육센터", "!수련관"]
  체육·수영: [수영, 헬스, 요가, 필라테스, 에어로빅, 생활체육, 체육, 스포츠, 아쿠아, 강습]
  다문화·한국어: [다문화, 이중언어, 한국어, 결혼이민, 언어발달]  # 가족센터 이중언어·한국어 강사 ('다문화' 속 '문화'로 평생교육·문화에 가지 않게 앞에 둠)
  평생교육·문화: [평생, 도서관, 문화, 예술, 공예, 음악, 미술, 인문, 강좌, 특강, 교육강사, 주민자치]
  직업훈련: [직업, 훈련, 자격증, 새일, 취업, 창업]
  학교 기타: [초등학교, 중학교, 고등학교, 유치원, 학교]
