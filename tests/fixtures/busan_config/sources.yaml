# 부산 강사 구인공고 수집 대상 목록
#
# - phase: 구현 단계. max_phase 이하이면서 enabled: true 인 소스만 매일 수집한다.
#     1단계 교육청·학교와 국가 공공기관 / 2단계 지자체·공단(체육시설) / 3단계 평생학습·도서관·청소년·여성·시 출연기관
# - verified: GitHub Actions 러너에서 실제 접속·목록 구조를 확인한 소스.
# - keyword_filter: 강사 전용 게시판이면 false (모든 글 수집), 일반 게시판이면 true (강사 키워드로 거름).
# - options: 수집기별 설정 (page_param: 페이지 번호 파라미터, key_param: 게시글 번호 파라미터 등).
#   자세한 설명은 src/gyeongbuk_jobs/collectors/board.py 머리말 참고.
# - 해외 서버(GitHub 러너) 접속을 막는 사이트는 enabled: false 로 두고 blocked 에 까닭을 적었다.
#
# 새 소스를 추가할 때는 먼저 진단 도구로 구조를 확인한다:
#   GitHub Actions > 사이트 진단 (probe) > Run workflow > args: --no-reach --parse --url <목록 주소>
# 대학 부설 평생교육원은 다른 저장소(lifelong-education-pyengsang-)도 모으지만, 부산 강사 공고를 한 메일로 받도록 여기에도 넣었다.

max_phase: 3

sources:
  # ─────────────────────────────── 국가·공공 (공식 API·통합 채용 사이트)
  - id: work24_api
    name: 고용24(워크넷) 채용정보 Open API
    org_type: 국가·공공기관
    district: 부산전체
    collector: work24_api
    url: https://www.work24.go.kr/cm/e/a/0110/selectOpenApiIntro.do
    params:
      region: "26000"   # 부산광역시 전체
      keyword: 강사
    auth_env: WORK24_API_KEY  # 없으면 '설정필요'로 표시하고 건너뜀
    keyword_filter: true
    phase: 1
    enabled: true
    verified: false

  - id: gojobs_list
    name: 나라일터 모집공고 (기관명에 '부산' 포함)
    org_type: 국가·공공기관
    district: 부산전체
    collector: generic_board
    # 기관명 검색(searchSelectninsttnm=부산)은 GET 으로 되고, 부산 소재 국가기관·지자체·교육청·학교 공고가 나온다
    url: https://www.gojobs.go.kr/apmList.do?menuNo=401&searchJobsecode=020&searchSelectninsttnm=%EB%B6%80%EC%82%B0&pageIndex=1
    pages: 1  # 2쪽은 POST 전용
    keyword_filter: true
    phase: 1
    enabled: true
    verified: true
    options:
      link_template: "https://www.gojobs.go.kr/apmView.do?empmnsn={1}&searchJobsecode={0}&menuNo=401&selMenuNo=400"
      key_param: empmnsn

  - id: alio_recruit
    name: 잡알리오 공공기관 채용정보 (근무지 부산)
    org_type: 국가·공공기관
    district: 부산전체
    collector: form_board  # 목록은 검색 폼(_csrf 토큰)을 POST 해야 나온다
    url: https://job.alio.go.kr/recruit.do
    pages: 2
    keyword_filter: true
    phase: 1
    enabled: true
    verified: true
    options:
      form_selector: "form#frm"
      data:
        search_yn: "Y"
        location: R3014  # 부산광역시 (검색 폼의 근무지 선택값)
      page_param: pageNo
      key_param: idx

