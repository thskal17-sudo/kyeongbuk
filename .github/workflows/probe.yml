name: 사이트 진단 (probe)

on:
  workflow_dispatch:
    inputs:
      args:
        description: "probe.py 인자 (예: --no-reach --parse --url https://... / --detail pen_school_hire)"
        required: false
        default: ""
      check:
        description: "check-source 로 시험 수집할 소스 id (공백 구분, 예: pen_school_hire bnfmc_hire)"
        required: false
        default: ""
      runner:
        description: "어디서 진단할지 (github: GitHub 수집 서버(미국) / korea: 한국 PC 자체 실행기)"
        type: choice
        options: [github, korea]
        default: github
  # 후보 주소 목록(scripts/probe_urls.txt)을 바꿔 올리면 그 주소들에 게시판 파서를 돌려 본다
  push:
    paths:
      - "scripts/probe_urls.txt"

jobs:
  probe:
    runs-on: ${{ github.event.inputs.runner == 'korea' && fromJSON('["self-hosted","korea"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - if: github.event.inputs.runner != 'korea'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          PY=$(command -v python || command -v python3 || command -v py)
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install -q -r requirements.txt
      # set -f: URL 의 ? 등이 파일 이름으로 확장되지 않게 함
      - if: github.event_name == 'push'
        run: '"$PY" scripts/probe.py --no-reach --parse --url-file scripts/probe_urls.txt'
        env:
          PYTHONUNBUFFERED: "1"
      - if: github.event_name == 'workflow_dispatch' && github.event.inputs.check == ''
        run: set -f; "$PY" scripts/probe.py $PROBE_ARGS
        env:
          PYTHONUNBUFFERED: "1"
          PROBE_ARGS: ${{ github.event.inputs.args }}
      - if: github.event_name == 'workflow_dispatch' && github.event.inputs.check != ''
        run: '"$PY" -m gyeongbuk_jobs check-source $CHECK_IDS'
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          CHECK_IDS: ${{ github.event.inputs.check }}
