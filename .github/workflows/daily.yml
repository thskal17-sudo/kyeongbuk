name: 매일 강사 공고 수집·메일 발송

on:
  schedule:
    # GitHub 무료 예약 실행은 몇 시간씩 밀린다 (2026-10-23~11-03: 06:17 예약이 2~5.5시간 늦게 시작, 낮 12시 수집도 있었음).
    # 부산·경남판처럼 예약을 세 번 걸고, 그날 먼저 시작한 실행만 수집·메일을 하고 나머지는 바로 끝낸다
    # (아래 '오늘 예약 수집을 이미 했나' 단계). 정각·30분을 피했고 부산·경남·울산·캠프 예약과 겹치지 않는다.
    # 한국 PC(korea.yml, 05:47) 보다 먼저 시작한 실행은 전날 한국 PC 결과를 쓰고, 그날 결과는 다음 수집에 들어간다.
    - cron: "17 18 * * *"   # 03:17 KST
    - cron: "57 19 * * *"   # 04:57 KST (예비)
    - cron: "17 21 * * *"   # 06:17 KST (예비)
  workflow_dispatch:
    inputs:
      send_mail:
        description: "메일 발송 (끄면 수집·엑셀만 하고 결과는 Artifacts 에서 확인)"
        type: boolean
        default: true

permissions:
  contents: write # state 브랜치에 수집 기록(DB) 저장

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      retry_sources: ${{ steps.run.outputs.retry_sources }}
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 수집 기록(DB) 가져오기
        run: |
          bash scripts/state_db.sh restore
          # 한국 PC(자체 실행기)가 05:47 에 읽어 둔 해외 차단 사이트 결과 (korea.yml)
          bash scripts/state_db.sh restore data/korea.db state-korea

      # 예약 세 번 중 먼저 시작한 실행이 이미 끝냈으면 이번 실행은 건너뛴다 (손으로 돌린 실행은 늘 진행)
      - name: 오늘 예약 수집을 이미 했나
        id: done
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          last=$(cat data/last_scheduled_run 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "오늘($today) 예약 수집은 이미 끝남 → 건너뜀"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집 → 엑셀 → 메일
        id: run
        if: steps.done.outputs.skip != 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KR_PROXY_URL: ${{ secrets.KR_PROXY_URL }}  # 국내 중계 서버(네이버 클라우드). 없으면 바로 접속
          SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail }}
        run: |
          mail=""
          if [ "$SEND_MAIL" != "true" ]; then mail="--no-mail"; fi
          python -m gyeongbuk_jobs run --db data/postings.db --out out --retry-list out/retry_sources.txt --korea-db data/korea.db $mail
          echo "retry_sources=$(cat out/retry_sources.txt)" >> "$GITHUB_OUTPUT"

      - name: 엑셀 보관 (30일)
        if: always() && steps.done.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: out/*.xlsx
          if-no-files-found: ignore
          retention-days: 30

      # 메일을 보내지 못한 공고는 DB 에 '미발송'으로 남아 다음 실행 때 다시 신규로 보내진다
      - name: 수집 기록(DB) 저장
        if: always() && steps.done.outputs.skip != 'true' && hashFiles('data/postings.db') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 예약 실행이 메일까지 마쳤을 때만 '오늘 끝남' 표시를 남긴다 (실패하면 다음 예약이 다시 한다)
          SCHEDULED_DONE: ${{ github.event_name == 'schedule' && steps.run.outcome == 'success' }}
        run: bash scripts/state_db.sh save

  # 구·군청 등 일부 사이트는 수집 서버(GitHub 가 배정하는 해외 서버)의 지역에 따라 접속이 막힌다.
  # 접속 안 된 사이트가 있으면 새 서버를 받아 그 사이트만 한 번 더 수집하고, 새 공고가 있을 때만 보충 메일을 보낸다.
  catch-up:
    needs: collect
    if: needs.collect.outputs.retry_sources != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 수집 기록(DB) 가져오기
        run: bash scripts/state_db.sh restore

      - name: 접속 안 된 사이트 다시 수집 → 보충 메일
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KR_PROXY_URL: ${{ secrets.KR_PROXY_URL }}  # 국내 중계 서버(네이버 클라우드). 없으면 바로 접속
          SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail }}
          RETRY_SOURCES: ${{ needs.collect.outputs.retry_sources }}
        run: |
          mail=""
          if [ "$SEND_MAIL" != "true" ]; then mail="--no-mail"; fi
          python -m gyeongbuk_jobs run --db data/postings.db --out out --catch-up --source $RETRY_SOURCES $mail

      - name: 엑셀 보관 (30일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}-catch-up
          path: out/*.xlsx
          if-no-files-found: ignore
          retention-days: 30

      - name: 수집 기록(DB) 저장
        if: always() && hashFiles('data/postings.db') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/state_db.sh save
