name: 한국 PC 수집 (해외 차단 사이트)

# 시·군 누리집 일부(도서관·평생학습관·청도·울릉·청송군청 등)는 해외 IP 를 막아 GitHub 수집 서버가 읽지 못한다.
# 사무실·집의 한국 PC 에 설치한 GitHub 자체 실행기(라벨 korea)가 그 사이트(sources.yaml 의 korea_only)만 읽어
# state-korea 브랜치에 저장하면, 매일 메일 작업(daily.yml)이 가져와 한 메일로 보낸다. 설치 방법은 README 참고.
on:
  schedule:
    # 매일 05:47 KST (= UTC 20:47). 매일 메일(06:17)보다 30분 먼저
    - cron: "47 20 * * *"
  workflow_dispatch:

permissions:
  contents: write # state-korea 브랜치에 수집 기록(DB) 저장

# PC 가 꺼져 있으면 작업이 실행기를 기다리며 쌓이므로, 다음 날 작업이 오면 앞의 것은 취소한다
concurrency:
  group: korea-collect
  cancel-in-progress: true

jobs:
  korea:
    runs-on: [self-hosted, korea]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 패키지 설치
        run: python -m pip install -q -r requirements.txt

      - name: 이전 수집 기록(DB) 가져오기
        run: bash scripts/state_db.sh restore data/korea.db state-korea

      - name: 해외 차단 사이트 수집
        run: python -m gyeongbuk_jobs run --korea --db data/korea.db --out out-korea

      - name: 수집 기록(DB) 저장
        if: always() && hashFiles('data/korea.db') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/state_db.sh save data/korea.db state-korea
